[package]
name = "clipper"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
gpui-kit = "0.9.0"
gpui = { package = "gpui-pre", version = "=0.3.11" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smallvec = "1"
raw-window-handle = "0.6"
rodio = { version = "0.20", default-features = false }
whisper-rs = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.11"
ab_glyph = "0.2"
rustybuzz = "0.20"
webp-animation = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12.0"
resvg = "0.49.0"
cosmic-text = "0.19.0"
emojis = "0.9.1"
trash = "5.3.0"
libwebp-sys2 = "0.2"

[features]
# Speech to text on the GPU (Metal) instead of the CPU.
gpu = ["whisper-rs/metal"]

# Debug builds run the image work (backgrounds, shadow blur, cursor) optimized; unoptimized
# it is ~20× slower and makes the preview lag behind the sliders.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
